[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/packet-parser",
    "crates/detection",
    "crates/packet-capture",
    "crates/api-server",
    "crates/traffic-simulator",
]
# dpdk-sys is excluded — only compiled when packet-capture's "dpdk" feature
# is enabled (Linux with DPDK installed).
exclude = ["crates/dpdk-sys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NetShield Contributors"]
license = "MIT"

[workspace.lints.clippy]
clone_on_ref_ptr   = "deny"
unwrap_used        = "warn"
expect_used        = "warn"
large_enum_variant = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
